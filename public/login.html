<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · CanteenGo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="center-page">
    <div class="glass-card" style="width:100%;max-width:420px">
      <div class="brand" style="margin-bottom:6px"><span class="brand-dot"></span> CanteenGo Back-Office</div>
      <p class="muted" style="margin-bottom:18px">For Canteen Staff, School Cashier and Admin.</p>
      <div id="msg"></div>
      <form id="loginForm">
        <div class="field">
          <label for="loginId">Username</label>
          <input id="loginId" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="loginPw">Password</label>
          <input id="loginPw" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn block" type="submit">Sign in</button>
      </form>
      <div class="divider"></div>
      <p class="muted" style="font-size:0.8rem;margin:0">
        Demo accounts: <span class="mono">staff / staff123</span>, <span class="mono">cashier / cashier123</span>,
        <span class="mono">admin / admin123</span>. Change these after deploying.
      </p>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    api('/api/auth/me', { noRedirect: true }).then((me) => (location.href = me.home)).catch(() => {});
    $('#loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      withBusy(e.submitter, async () => {
        try {
          const r = await api('/api/auth/login', { method: 'POST', noRedirect: true, body: { login_id: $('#loginId').value, password: $('#loginPw').value } });
          location.href = r.home;
        } catch (err) { showError($('#msg'), err.message); }
      });
    });
  </script>
</body>
</html>
