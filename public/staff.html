<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8f7ef" />
  <title>Staff · Canteen Back-Office</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="staff-app">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand"><span class="brand-dot"></span> Canteen Staff</span>
      <!-- Top tabs: laptop / large screens only (phones and tablets use the bottom bar) -->
      <nav class="nav top-nav">
        <button data-tab="queue">Order Queue</button>
        <button data-tab="pickup">Pickup / Scan</button>
        <button data-tab="lunch">End of Lunch</button>
        <button data-tab="walkin">Walk-In Sale</button>
      </nav>
      <span class="spacer"></span>
      <span class="user-chip hide-mobile" id="userName"></span>
      <button class="btn ghost sm desk-only" onclick="changePasswordDialog()">Password</button>
      <button class="btn ghost sm desk-only" onclick="logout()">Log out</button>
      <button class="icon-btn more-btn" id="moreBtn" aria-label="Account menu" title="Account">⋮</button>
    </div>
  </header>

  <main class="container">
    <!-- Order queue -->
    <section id="tab-queue" class="stack hidden">
      <div class="stat-grid" id="queueStats"></div>
      <div class="row between">
        <h2 style="margin:0">Today's orders</h2>
        <small class="muted">Updates every 10 seconds</small>
      </div>
      <div id="queueList" class="stack"></div>
    </section>

    <!-- Pickup -->
    <section id="tab-pickup" class="stack hidden">
      <div class="glass-card pickup-card">
        <h2>Verify &amp; release</h2>
        <button class="btn block scan-btn" type="button" id="scanBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
          <span>Scan QR</span>
        </button>
        <video id="scanVideo" class="hidden" playsinline muted></video>
        <div class="or-line"><span>or type the order number</span></div>
        <form id="lookupForm" class="row nowrap">
          <input id="codeInput" class="mono code-input" placeholder="e.g. K7M3QD" autocomplete="off" autocapitalize="characters" spellcheck="false" />
          <button class="btn" type="submit">Find</button>
        </form>
      </div>
      <div id="pickupResult" class="pickup-card"></div>
    </section>

    <!-- End of lunch -->
    <section id="tab-lunch" class="stack hidden">
      <div id="lunchInfo"></div>
      <div id="unclaimedList"></div>
    </section>

    <!-- Walk-in -->
    <section id="tab-walkin" class="hidden">
      <div class="walkin-grid">
        <div class="glass-card items-card">
          <h2>Items</h2>
          <div id="walkinMenu"></div>
        </div>
        <div class="stack">
          <div class="glass-card pay-card">
            <h2>Payment</h2>
            <div class="tabs" id="payTabs">
              <button type="button" class="active" data-pay="wallet">Student wallet</button>
              <button type="button" data-pay="cash">Cash</button>
            </div>
            <div id="walkinStudent"></div>
            <div id="walkinStudentSearch"></div>
            <small class="muted" id="cashHint"></small>
          </div>
          <div class="glass-card sum-card">
            <h2>Summary</h2>
            <ul class="order-items" id="walkinSummary"></ul>
            <div class="row between"><b>Total</b><b id="walkinTotal">₱0.00</b></div>
            <button class="btn block desk-only" id="walkinSubmit" style="margin-top:12px">Complete sale</button>
            <p class="muted" style="font-size:0.8rem;margin:8px 0 0">Walk-in sales do not count toward no-shows.</p>
          </div>
        </div>
      </div>
      <!-- Phones / tablets: total + Complete sale always visible -->
      <div class="walkin-bar glass" id="walkinBar">
        <div><b id="walkinBarTotal">₱0.00</b><br><small class="muted" id="walkinBarCount">No items</small></div>
        <button class="btn" id="walkinSubmitMobile">Complete sale</button>
      </div>
    </section>
  </main>

  <!-- Bottom tab bar: phones and tablets -->
  <nav class="nav bottom-nav" aria-label="Staff sections">
    <button data-tab="queue">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Queue</span><i class="nav-count hidden" id="navQueueCount"></i>
    </button>
    <button data-tab="pickup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
      <span>Pickup</span>
    </button>
    <button data-tab="lunch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      <span>End of Lunch</span>
    </button>
    <button data-tab="walkin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span>Walk-in</span>
    </button>
  </nav>

  <script src="/js/common.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/staff.js"></script>
</body>
</html>
